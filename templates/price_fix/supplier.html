<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e5e7eb; border-left:4px solid #f59e0b; border-radius:8px; margin-bottom:12px;">
  <tr>
    <td style="padding:14px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
          <td style="font-size:14px; font-weight:700; color:#111827;">{{SUPPLIER}}</td>
          <td align="right" style="white-space:nowrap;">
            <span style="display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:700; background:#fef3c7; color:#92400e;">{{COUNT}} product(s)</span>
          </td>
        </tr>
      </table>
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:10px; font-size:12px; border-collapse:collapse;">
        <tr>
          <th align="left" style="padding:6px 8px; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:#9ca3af; border-bottom:1px solid #e5e7eb;">SKU</th>
          <th align="right" style="padding:6px 8px; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:#9ca3af; border-bottom:1px solid #e5e7eb;">Original</th>
          <th align="right" style="padding:6px 8px; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:#9ca3af; border-bottom:1px solid #e5e7eb;">New</th>
          <th align="right" style="padding:6px 8px; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:#9ca3af; border-bottom:1px solid #e5e7eb;">Change</th>
        </tr>
        {{ROWS}}
      </table>
    </td>
  </tr>
</table>
