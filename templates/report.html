<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extraction report</title>
</head>
<body style="margin:0; padding:0; background:#ffffff; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#1f2328;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">

    <!-- Header -->
    <tr>
      <td style="background:#111827; color:#ffffff; padding:28px 32px;">
        <div style="font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#9ca3af;">jumakl-extractor</div>
        <div style="font-size:22px; font-weight:700; margin-top:6px;">Extraction report</div>
        <div style="font-size:13px; color:#d1d5db; margin-top:6px;">Completed in {{ELAPSED}}</div>
      </td>
    </tr>

    <!-- Status banner -->
    <tr>
      <td style="background:{{TONE_BG}}; color:{{TONE_TEXT}}; padding:14px 32px; font-size:13px; font-weight:700; border-bottom:1px solid {{TONE_ACCENT}};">
        {{STATUS_LABEL}}
      </td>
    </tr>

    <!-- Program errors (empty when there are none) -->
    <tr>
      <td style="padding:0;">
        {{PROGRAM_ERRORS}}
      </td>
    </tr>

    <!-- Stats -->
    <tr>
      <td style="padding:0;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-bottom:1px solid #e5e7eb;">
          <tr>
            <td width="25%" align="center" style="padding:20px 8px; border-right:1px solid #f0f1f3;">
              <div style="font-size:26px; font-weight:700; line-height:1.2; color:#111827;">{{SOURCE_COUNT}}</div>
              <div style="font-size:11px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:#9ca3af; margin-top:2px;">Sources</div>
            </td>
            <td width="25%" align="center" style="padding:20px 8px; border-right:1px solid #f0f1f3;">
              <div style="font-size:26px; font-weight:700; line-height:1.2; color:#111827;">{{RECORD_COUNT}}</div>
              <div style="font-size:11px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:#9ca3af; margin-top:2px;">Records</div>
            </td>
            <td width="25%" align="center" style="padding:20px 8px; border-right:1px solid #f0f1f3;">
              <div style="font-size:26px; font-weight:700; line-height:1.2; color:#111827;">{{EXCLUDED_COUNT}}</div>
              <div style="font-size:11px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:#9ca3af; margin-top:2px;">Excluded</div>
            </td>
            <td width="25%" align="center" style="padding:20px 8px;">
              <div style="font-size:26px; font-weight:700; line-height:1.2; color:#111827;">{{ERROR_COUNT}}</div>
              <div style="font-size:11px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:#9ca3af; margin-top:2px;">Errors</div>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Sources -->
    <tr>
      <td style="padding:24px 32px 8px;">
        <div style="font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#9ca3af; margin-bottom:12px;">By source</div>
        {{SOURCES}}
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td align="center" style="padding:20px 32px 28px; font-size:11px; color:#9ca3af;">
        Automated report from jumakl-extractor
      </td>
    </tr>

  </table>
</body>
</html>
